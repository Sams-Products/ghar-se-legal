<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Ghar Se</title>
  <meta name="description" content="Open this seller profile in the Ghar Se app, or download it from Google Play." />
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #0f766e;
      --border: #e7e5e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 40%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(28, 25, 23, 0.08);
    }
    .brand {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.55rem;
      line-height: 1.25;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .primary {
      background: var(--accent);
      color: #fff;
    }
    .secondary {
      background: #f5f5f4;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Ghar Se</div>
    <h1 id="title">Open this seller in Ghar Se</h1>
    <p id="subtitle">
      If you already have the app, tap Open. If not, download Ghar Se from Google Play.
    </p>
    <div class="actions">
      <a class="btn primary" id="openApp" href="#">Open in Ghar Se</a>
      <a class="btn secondary" id="playStore" href="https://play.google.com/store/apps/details?id=com.gharse.app">
        Get it on Google Play
      </a>
    </div>
    <p class="hint" id="hint">Trying to open the app…</p>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sellerId = (params.get('id') || '').trim();
      var sellerName = (params.get('name') || '').trim();
      var playStore = 'https://play.google.com/store/apps/details?id=com.gharse.app';
      var title = document.getElementById('title');
      var subtitle = document.getElementById('subtitle');
      var openApp = document.getElementById('openApp');
      var playStoreLink = document.getElementById('playStore');
      var hint = document.getElementById('hint');

      playStoreLink.href = playStore;

      if (!sellerId) {
        title.textContent = 'Ghar Se';
        subtitle.textContent = 'Download the Ghar Se app to discover local home services across Pakistan.';
        openApp.style.display = 'none';
        hint.textContent = '';
        return;
      }

      if (sellerName) {
        title.textContent = sellerName + ' on Ghar Se';
        subtitle.textContent =
          'Open this seller profile in the app, or install Ghar Se from Google Play.';
      }

      var deepLink = 'ghar-se://seller/' + encodeURIComponent(sellerId);
      openApp.href = deepLink;

      var fallbackTimer = setTimeout(function () {
        hint.textContent = 'App not opening? Use Google Play below.';
      }, 1800);

      // Attempt auto-open once (works best outside Instagram in-app browser).
      var started = Date.now();
      window.location.href = deepLink;

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
          hint.textContent = 'Opening Ghar Se…';
        }
      });

      // If still visible after a short wait, keep Play Store CTA visible (already on page).
      setTimeout(function () {
        if (Date.now() - started > 1500 && !document.hidden) {
          hint.textContent = 'App not installed? Download from Google Play.';
        }
      }, 2200);
    })();
  </script>
</body>
</html>
